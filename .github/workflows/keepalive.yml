# Supabase pauses free projects after a week without activity. This pings the chat
# function's health check (which queries the database) once a day to keep it awake.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health check
        env:
          FUNCTIONS_URL: ${{ vars.SUPABASE_FUNCTIONS_URL }}
        run: |
          test -n "$FUNCTIONS_URL" || { echo "Set the SUPABASE_FUNCTIONS_URL repository variable"; exit 1; }
          curl -fsS --retry 3 "$FUNCTIONS_URL/chat"
